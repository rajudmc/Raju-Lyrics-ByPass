<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raju Lyrics ByPass</title>
  <style>
    :root {
      --theme-bg-left: #292008;
      --theme-bg-right: #292008;
      --theme-accent-left: #facc15;
      --theme-accent-right: #f59e0b;
      --theme-light: #fef08a;
      --theme-border-left: rgba(250, 204, 21, 0.38);
      --theme-border-right: rgba(250, 204, 21, 0.38);
      --theme-border-soft: rgba(250, 204, 21, 0.24);
      --theme-glow-left: rgba(250, 204, 21, 0.16);
      --theme-glow-right: rgba(250, 204, 21, 0.16);
      --theme-btn-bg: #2e291d;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      background:
        radial-gradient(circle at 22% 22%, var(--theme-bg-left) 0%, transparent 62%),
        radial-gradient(circle at 78% 22%, var(--theme-bg-right) 0%, transparent 62%),
        #09090b;
      color: #fefce8;
      margin: 0;
      padding: 20px 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      transition: background 1.2s ease;
    }

    #butterfly-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 5; overflow: hidden; perspective: 1200px;
    }
    #fx-overlay-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 25; overflow: hidden;
    }
    .butterfly-3d { position: absolute; top: 0; left: 0; transform-style: preserve-3d; will-change: transform; }
    .butterfly-rig { position: relative; transform-style: preserve-3d; transition: transform 0.8s ease; }
    .butterfly-3d.flying .wing-left-real { transform-origin: 70px 70px; animation: flapLeftFly 0.42s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate; }
    .butterfly-3d.flying .wing-right-real { transform-origin: 70px 70px; animation: flapRightFly 0.42s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate; }
    .butterfly-3d.perched .wing-left-real { transform-origin: 70px 70px; animation: flapLeftRest 1.9s ease-in-out infinite alternate; }
    .butterfly-3d.perched .wing-right-real { transform-origin: 70px 70px; animation: flapRightRest 1.9s ease-in-out infinite alternate; }
    @keyframes flapLeftFly { 0% { transform: rotateY(-10deg) rotateZ(2deg); } 100% { transform: rotateY(72deg) rotateZ(-5deg); } }
    @keyframes flapRightFly { 0% { transform: rotateY(10deg) rotateZ(-2deg); } 100% { transform: rotateY(-72deg) rotateZ(5deg); } }
    @keyframes flapLeftRest { 0% { transform: rotateY(18deg) rotateZ(0deg); } 100% { transform: rotateY(62deg) rotateZ(-3deg); } }
    @keyframes flapRightRest { 0% { transform: rotateY(-18deg) rotateZ(0deg); } 100% { transform: rotateY(-62deg) rotateZ(3deg); } }
    .butterfly-3d.flying .side-wing-front { transform-origin: 55px 72px; animation: sideFlapFront 0.40s ease-in-out infinite alternate; }
    .butterfly-3d.flying .side-wing-back { transform-origin: 55px 72px; animation: sideFlapBack 0.40s ease-in-out infinite alternate; }
    .butterfly-3d.perched .side-wing-front { transform-origin: 55px 72px; animation: sideRestFront 1.8s ease-in-out infinite alternate; }
    .butterfly-3d.perched .side-wing-back { transform-origin: 55px 72px; animation: sideRestBack 1.8s ease-in-out infinite alternate; }
    @keyframes sideFlapFront { 0% { transform: rotateX(0deg) scaleY(1); } 100% { transform: rotateX(68deg) scaleY(0.35); } }
    @keyframes sideFlapBack { 0% { transform: rotateX(-12deg) scaleY(0.92) translate(-4px, -3px); } 100% { transform: rotateX(55deg) scaleY(0.30) translate(-2px, -1px); } }
    @keyframes sideRestFront { 0% { transform: rotateX(8deg) scaleY(0.95); } 100% { transform: rotateX(45deg) scaleY(0.55); } }
    @keyframes sideRestBack { 0% { transform: rotateX(0deg) scaleY(0.88) translate(-4px, -3px); } 100% { transform: rotateX(36deg) scaleY(0.50) translate(-2px, -1px); } }
    .landing-ring {
      position: absolute; width: 14px; height: 14px; border-radius: 50%;
      border: 2.5px solid var(--glow-color); box-shadow: 0 0 14px var(--glow-color), inset 0 0 8px var(--glow-color);
      transform: translate(-50%, -50%) scale(0.2); pointer-events: none;
      animation: rippleExpand 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .landing-ring-2 {
      position: absolute; width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid var(--glow-light); box-shadow: 0 0 18px var(--glow-color);
      transform: translate(-50%, -50%) scale(0.2); pointer-events: none;
      animation: rippleExpand 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.22s forwards;
    }
    @keyframes rippleExpand { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.95; } 100% { transform: translate(-50%, -50%) scale(6.5); opacity: 0; } }
    .landing-spark {
      position: absolute; width: 5px; height: 5px; border-radius: 50%;
      background: var(--glow-light); box-shadow: 0 0 8px var(--glow-color), 0 0 12px var(--glow-light);
      pointer-events: none; animation: sparkFly 1.3s ease-out forwards;
    }
    @keyframes sparkFly { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity: 0; } }
    .touch-ripple {
      position: absolute; width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--theme-accent-left); box-shadow: 0 0 14px var(--theme-accent-right), inset 0 0 8px var(--theme-light);
      transform: translate(-50%, -50%) scale(0.2); pointer-events: none;
      animation: touchWave 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes touchWave { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(4.2); opacity: 0; } }
    .touch-dot {
      position: absolute; width: 4.5px; height: 4.5px; border-radius: 50%;
      background: var(--t-color); box-shadow: 0 0 8px var(--t-color);
      pointer-events: none; animation: touchSpark 0.65s ease-out forwards;
    }
    @keyframes touchSpark { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }
    .container { max-width: 600px; width: 100%; position: relative; z-index: 3; }
    .header { text-align: center; margin-bottom: 22px; position: relative; z-index: 10; }
    .header h1 {
      font-size: 28px; margin: 0 0 6px 0;
      background: linear-gradient(90deg, var(--theme-accent-left), var(--theme-light), #ffffff, var(--theme-accent-right), var(--theme-accent-left));
      background-size: 250% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-weight: 800; animation: textLoopShine 3s linear infinite, floatPulse 2.5s ease-in-out infinite;
    }
    @keyframes textLoopShine { 0% { background-position: 0% center; } 100% { background-position: 250% center; } }
    @keyframes floatPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .header p { color: #a1a1aa; margin: 0; font-size: 13px; }
    .card {
      position: relative; z-index: 2;
      background: linear-gradient(90deg, rgba(24, 24, 27, 0.86) 0%, rgba(24, 24, 27, 0.86) 100%);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--theme-border-left);
      border-left: 1px solid var(--theme-border-left);
      border-right: 1px solid var(--theme-border-right);
      border-bottom: 1px solid var(--theme-border-right);
      border-radius: 16px; padding: 20px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.65),
        -12px 0 28px var(--theme-glow-left),
        12px 0 28px var(--theme-glow-right);
      transition: border-color 1s ease, box-shadow 1s ease;
    }
    .label-row, textarea, button, #resultSection, .status-bar { position: relative; z-index: 10; }
    .label-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
      font-size: 13px; color: var(--theme-light); font-weight: 600;
      transition: color 1s ease;
    }
    textarea {
      width: 100%; height: 150px; background-color: rgba(9, 9, 11, 0.78); color: #fefce8;
      border-top: 1px solid var(--theme-border-left);
      border-left: 1px solid var(--theme-border-left);
      border-right: 1px solid var(--theme-border-right);
      border-bottom: 1px solid var(--theme-border-right);
      border-radius: 12px; padding: 14px;
      font-size: 15px; line-height: 1.5; resize: vertical; margin-bottom: 14px;
      transition: border-color 1s ease, box-shadow 1s ease;
    }
    textarea:focus { outline: none; border-color: var(--theme-accent-left); box-shadow: 0 0 0 3px var(--theme-glow-left); }
    button {
      width: 100%; border: none; padding: 14px 18px; border-radius: 12px; cursor: pointer;
      font-size: 15px; font-weight: 700; transition: all 0.25s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:active { transform: scale(0.96); }
    .btn-bypass { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }
    .btn-copy { background: linear-gradient(135deg, #06b6d4, #10b981); color: #042f2e; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35); }
    .done-grey { background: #3f3f46 !important; color: #d4d4d8 !important; box-shadow: none !important; border: 1px solid #52525b !important; animation: popPulse 0.35s ease; }
    @keyframes popPulse { 0% { transform: scale(1); } 40% { transform: scale(0.92); } 75% { transform: scale(1.03); } 100% { transform: scale(1); } }
    .btn-ghost {
      width: auto; background-color: var(--theme-btn-bg); color: var(--theme-light);
      border: 1px solid var(--theme-border-soft); padding: 6px 12px; font-size: 12px; border-radius: 8px;
      transition: background-color 1s ease, color 1s ease, border-color 1s ease;
    }
    #resultSection {
      display: none; margin-top: 20px; padding-top: 18px;
      border-top: 1px dashed var(--theme-border-left); animation: fadeIn 0.35s ease;
      transition: border-color 1s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .status-bar {
      text-align: center; font-size: 13px; color: var(--theme-accent-left);
      min-height: 18px; margin-top: 12px; font-weight: 500;
      transition: color 1s ease;
    }
  </style>
</head>
<body>

<audio id="bgSong" src="song.mp3" autoplay loop playsinline preload="auto"></audio>

<div id="butterfly-layer"></div>
<div id="fx-overlay-layer"></div>

<div class="container">
  <div class="header">
    <h1> ⚡ RAJU LYRICS BYPASS </h1>
    <p>100% Free & Offline • Instant Filter Bypass</p>
  </div>

  <div class="card">
    <div class="label-row">
      <span id="target-label">📝 Enter Your Lyrics</span>
      <div style="display:flex; gap:6px;">
        <button id="target-paste" class="btn-ghost" onclick="pasteLyrics()">📋 Paste</button>
        <button id="target-reset" class="btn-ghost" onclick="clearAll()">🗑️ Reset</button>
      </div>
    </div>
    
    <textarea id="inputLyrics" oninput="resetBypassBtn()" placeholder="Yahan apne gaane ke lyrics paste karein..."></textarea>

    <button id="bypassBtn" class="btn-bypass" onclick="processLyrics()">⚡ Bypass Lyrics</button>

    <div id="resultSection">
      <div class="label-row">
        <span>✅ Bypassed Lyrics Ready</span>
        <span id="charCount" style="color:var(--theme-accent-right); font-size:12px;">0 chars</span>
      </div>
      
      <textarea id="outputLyrics" readonly></textarea>
      
      <button id="copyBtn" class="btn-copy" onclick="copyLyrics()">📋 Copy Lyrics</button>
    </div>

    <div id="statusText" class="status-bar"></div>
  </div>
</div>

<script>
  const butterflyLayer = document.getElementById('butterfly-layer');
  const fxOverlayLayer = document.getElementById('fx-overlay-layer');
  const bgSong = document.getElementById('bgSong');

  function playSongNow() {
    if (bgSong && bgSong.paused) {
      bgSong.volume = 0.9;
      bgSong.play().catch(() => {});
    }
  }

  window.addEventListener('DOMContentLoaded', playSongNow);
  ['touchstart', 'touchend', 'click', 'keydown'].forEach(evt => {
    document.addEventListener(evt, playSongNow, { passive: true });
  });

  const touchColors = ['#facc15', '#38bdf8', '#ec4899', '#a855f7', '#34d399', '#fb923c'];
  let lastTouchTime = 0;
  function spawnTouchAnimation(x, y) {
    const now = Date.now();
    if (now - lastTouchTime < 45) return;
    lastTouchTime = now;
    const ripple = document.createElement('div');
    ripple.className = 'touch-ripple';
    ripple.style.left = x + 'px'; ripple.style.top = y + 'px';
    fxOverlayLayer.appendChild(ripple);
    setTimeout(() => ripple.remove(), 800);
    for (let i = 0; i < 7; i++) {
      const dot = document.createElement('div');
      dot.className = 'touch-dot';
      dot.style.left = x + 'px'; dot.style.top = y + 'px';
      dot.style.setProperty('--t-color', touchColors[Math.floor(Math.random() * touchColors.length)]);
      const angle = (Math.PI * 2 * i) / 7 + Math.random() * 0.5;
      const dist = 22 + Math.random() * 28;
      dot.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      dot.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      fxOverlayLayer.appendChild(dot);
      setTimeout(() => dot.remove(), 700);
    }
  }
  window.addEventListener('pointerdown', (e) => spawnTouchAnimation(e.clientX, e.clientY));
  window.addEventListener('pointermove', (e) => { if (e.buttons > 0 || e.pointerType === 'touch') spawnTouchAnimation(e.clientX, e.clientY); });

  const speciesList = [
    {
      name: 'monarch',
      cInner: '#ff9e00', cMid: '#ff5400', cBorder: '#111111', veinColor: '#111111',
      glowColor: '#ff7b00', glowLight: '#ffe066',
      theme: {
        bgTop: '#331704',
        accent: '#ff7b00',
        light: '#fed7aa',
        border: 'rgba(255, 123, 0, 0.42)',
        borderSoft: 'rgba(255, 123, 0, 0.25)',
        glow: 'rgba(255, 123, 0, 0.18)',
        btnBg: '#2e1e12'
      },
      hasStripes: false
    },
    {
      name: 'morpho',
      cInner: '#38bdf8', cMid: '#0284c7', cBorder: '#090d16', veinColor: '#0c243c',
      glowColor: '#0ea5e9', glowLight: '#bae6fd',
      theme: {
        bgTop: '#06263d',
        accent: '#38bdf8',
        light: '#bae6fd',
        border: 'rgba(56, 189, 248, 0.42)',
        borderSoft: 'rgba(56, 189, 248, 0.25)',
        glow: 'rgba(14, 165, 233, 0.18)',
        btnBg: '#122636'
      },
      hasStripes: false
    },
    {
      name: 'swallowtail',
      cInner: '#fef08a', cMid: '#eab308', cBorder: '#14120e', veinColor: '#14120e',
      glowColor: '#eab308', glowLight: '#fef9c3',
      theme: {
        bgTop: '#2e2407',
        accent: '#facc15',
        light: '#fef08a',
        border: 'rgba(250, 204, 21, 0.40)',
        borderSoft: 'rgba(250, 204, 21, 0.24)',
        glow: 'rgba(250, 204, 21, 0.16)',
        btnBg: '#2e291d'
      },
      hasStripes: true
    },
    {
      name: 'rose',
      cInner: '#f472b6', cMid: '#db2777', cBorder: '#1a0912', veinColor: '#2e091b',
      glowColor: '#ec4899', glowLight: '#fbcfe8',
      theme: {
        bgTop: '#360a22',
        accent: '#f472b6',
        light: '#fbcfe8',
        border: 'rgba(244, 114, 182, 0.42)',
        borderSoft: 'rgba(244, 114, 182, 0.25)',
        glow: 'rgba(236, 72, 153, 0.18)',
        btnBg: '#311726'
      },
      hasStripes: false
    }
  ];

  // सक्रिय तितलियों की स्थिति के अनुसार Left और Right दोनों साइड का अलग-अलग थीम अपडेट करना
  const liveButterflies = [];
  let lastThemeUpdate = 0;

  function syncDualSideThemes(now) {
    if (now - lastThemeUpdate < 180) return;
    lastThemeUpdate = now;
    if (liveButterflies.length === 0) return;

    const root = document.documentElement.style;
    const midX = window.innerWidth * 0.5;

    if (liveButterflies.length === 1) {
      const t = liveButterflies[0].sp.theme;
      root.setProperty('--theme-bg-left', t.bgTop);
      root.setProperty('--theme-bg-right', t.bgTop);
      root.setProperty('--theme-accent-left', t.accent);
      root.setProperty('--theme-accent-right', t.accent);
      root.setProperty('--theme-light', t.light);
      root.setProperty('--theme-border-left', t.border);
      root.setProperty('--theme-border-right', t.border);
      root.setProperty('--theme-border-soft', t.borderSoft);
      root.setProperty('--theme-glow-left', t.glow);
      root.setProperty('--theme-glow-right', t.glow);
      root.setProperty('--theme-btn-bg', t.btnBg);
    } else {
      // तितलियों को X पोजीशन से सॉर्ट करें: बाईं वाली Left थीम और दाईं वाली Right थीम संभालेगी
      const sorted = [...liveButterflies].sort((a, b) => a.x - b.x);
      const leftSp = sorted[0].sp.theme;
      const rightSp = sorted[sorted.length - 1].sp.theme;

      root.setProperty('--theme-bg-left', leftSp.bgTop);
      root.setProperty('--theme-bg-right', rightSp.bgTop);
      root.setProperty('--theme-accent-left', leftSp.accent);
      root.setProperty('--theme-accent-right', rightSp.accent);
      root.setProperty('--theme-light', leftSp.light);
      root.setProperty('--theme-border-left', leftSp.border);
      root.setProperty('--theme-border-right', rightSp.border);
      root.setProperty('--theme-border-soft', leftSp.borderSoft);
      root.setProperty('--theme-glow-left', leftSp.glow);
      root.setProperty('--theme-glow-right', rightSp.glow);
      root.setProperty('--theme-btn-bg', leftSp.btnBg);
    }
  }

  function createTopViewButterfly(sp, size, tiltDeg) {
    const id = 'top_' + Math.random().toString(36).substr(2, 9);
    const tigerStripesLeft = sp.hasStripes ? '<path d="M46 42 L35 28 M40 48 L25 32 M33 54 L18 41" stroke="#14120e" stroke-width="3.2" stroke-linecap="round"/>' : '';
    const tigerStripesRight = sp.hasStripes ? '<path d="M94 42 L105 28 M100 48 L115 32 M107 54 L122 41" stroke="#14120e" stroke-width="3.2" stroke-linecap="round"/>' : '';
    return `<div class="butterfly-rig" style="transform: rotateX(${tiltDeg}deg); filter: drop-shadow(0 14px 10px rgba(0, 0, 0, 0.75));">
      <svg width="${size}" height="${size}" viewBox="0 0 140 140" style="overflow: visible;">
        <defs><radialGradient id="g_${id}" cx="45%" cy="48%" r="65%"><stop offset="0%" stop-color="${sp.cInner}"/><stop offset="68%" stop-color="${sp.cMid}"/><stop offset="88%" stop-color="${sp.cBorder}"/><stop offset="100%" stop-color="${sp.cBorder}"/></radialGradient></defs>
        <g class="wing-left-real"><path d="M68 64 C50 28, 14 10, 6 28 C1 41, 12 60, 36 66 C50 69, 61 68, 68 67 Z" fill="url(#g_${id})" stroke="${sp.cBorder}" stroke-width="4.5" stroke-linejoin="round"/><path d="M68 69 C45 68, 18 82, 24 106 C27 116, 36 117, 39 127 C41 131, 44 123, 47 116 C52 119, 58 112, 62 100 C66 88, 68 78, 68 69 Z" fill="url(#g_${id})" stroke="${sp.cBorder}" stroke-width="4.2" stroke-linejoin="round"/><path d="M66 64 L16 26 M66 65 L10 38 M66 66 L16 52 M44 46 L26 20 M66 72 L30 100 M66 74 L43 112 M67 76 L56 104" stroke="${sp.veinColor}" stroke-width="2.1" stroke-linecap="round"/>${tigerStripesLeft}<circle cx="9" cy="26" r="1.6" fill="#ffffff"/><circle cx="6" cy="34" r="1.5" fill="#ffffff"/><circle cx="8" cy="42" r="1.5" fill="#ffffff"/><circle cx="12" cy="50" r="1.4" fill="#ffffff"/><circle cx="24" cy="102" r="1.5" fill="#ffffff"/><circle cx="28" cy="110" r="1.4" fill="#ffffff"/></g>
        <g class="wing-right-real"><path d="M72 64 C90 28, 126 10, 134 28 C139 41, 128 60, 104 66 C90 69, 79 68, 72 67 Z" fill="url(#g_${id})" stroke="${sp.cBorder}" stroke-width="4.5" stroke-linejoin="round"/><path d="M72 69 C95 68, 122 82, 116 106 C113 116, 104 117, 101 127 C99 131, 96 123, 93 116 C88 119, 82 112, 78 100 C74 88, 72 78, 72 69 Z" fill="url(#g_${id})" stroke="${sp.cBorder}" stroke-width="4.2" stroke-linejoin="round"/><path d="M74 64 L124 26 M74 65 L130 38 M74 66 L124 52 M96 46 L114 20 M74 72 L110 100 M74 74 L97 112 M73 76 L84 104" stroke="${sp.veinColor}" stroke-width="2.1" stroke-linecap="round"/>${tigerStripesRight}<circle cx="131" cy="26" r="1.6" fill="#ffffff"/><circle cx="134" cy="34" r="1.5" fill="#ffffff"/><circle cx="132" cy="42" r="1.5" fill="#ffffff"/><circle cx="128" cy="50" r="1.4" fill="#ffffff"/><circle cx="116" cy="102" r="1.5" fill="#ffffff"/><circle cx="112" cy="110" r="1.4" fill="#ffffff"/></g>
        <ellipse cx="70" cy="63" rx="3.8" ry="9" fill="#111111"/><ellipse cx="70" cy="83" rx="2.5" ry="14" fill="#1c1917"/><circle cx="70" cy="53" r="3" fill="#09090b"/>
        <path d="M69 51 Q61 37 55 35" stroke="#e4e4e7" stroke-width="1.3" fill="none" stroke-linecap="round"/><circle cx="55" cy="35" r="1.5" fill="#e4e4e7"/>
        <path d="M71 51 Q79 37 85 35" stroke="#e4e4e7" stroke-width="1.3" fill="none" stroke-linecap="round"/><circle cx="85" cy="35" r="1.5" fill="#e4e4e7"/>
      </svg></div>`;
  }

  function createSideViewButterfly(sp, size, flipHorizontal) {
    const id = 'side_' + Math.random().toString(36).substr(2, 9);
    const scaleX = flipHorizontal ? -1 : 1;
    const stripes = sp.hasStripes ? '<path d="M52 54 L28 32 M46 58 L20 42 M42 63 L18 52" stroke="#14120e" stroke-width="3" stroke-linecap="round"/>' : '';
    return `<div class="butterfly-rig" style="transform: scaleX(${scaleX}); filter: drop-shadow(0 14px 10px rgba(0, 0, 0, 0.78));">
      <svg width="${size}" height="${size}" viewBox="0 0 120 120" style="overflow: visible;">
        <defs><linearGradient id="sg_${id}" x1="20%" y1="15%" x2="85%" y2="85%"><stop offset="0%" stop-color="${sp.cInner}"/><stop offset="65%" stop-color="${sp.cMid}"/><stop offset="92%" stop-color="${sp.cBorder}"/></linearGradient></defs>
        <g class="side-wing-back"><path d="M56 68 C42 36, 16 14, 10 26 C5 37, 16 58, 42 69 Z" fill="${sp.cMid}" stroke="${sp.cBorder}" stroke-width="3.8" opacity="0.88"/><path d="M54 70 C36 68, 16 78, 22 95 C25 102, 32 103, 35 110 C38 104, 46 95, 54 72 Z" fill="${sp.cMid}" stroke="${sp.cBorder}" stroke-width="3.5" opacity="0.88"/></g>
        <g class="side-wing-front"><path d="M58 70 C44 34, 14 10, 7 24 C2 36, 15 60, 44 71 Z" fill="url(#sg_${id})" stroke="${sp.cBorder}" stroke-width="4.2" stroke-linejoin="round"/><path d="M56 72 C36 70, 14 82, 21 100 C24 108, 32 109, 35 117 C38 110, 48 98, 56 74 Z" fill="url(#sg_${id})" stroke="${sp.cBorder}" stroke-width="4" stroke-linejoin="round"/><path d="M55 69 L15 24 M55 70 L10 36 M54 71 L18 50 M54 74 L24 96 M54 75 L34 105" stroke="${sp.veinColor}" stroke-width="2" stroke-linecap="round"/>${stripes}<circle cx="10" cy="23" r="1.5" fill="#ffffff"/><circle cx="8" cy="31" r="1.4" fill="#ffffff"/><circle cx="11" cy="39" r="1.4" fill="#ffffff"/><circle cx="22" cy="96" r="1.4" fill="#ffffff"/><circle cx="26" cy="103" r="1.3" fill="#ffffff"/></g>
        <path d="M62 77 L66 88 L71 89 M57 78 L59 89 L64 90" stroke="#18181b" stroke-width="1.8" fill="none" stroke-linecap="round"/><ellipse cx="47" cy="77" rx="12" ry="3.2" transform="rotate(14 47 77)" fill="#1c1917"/><ellipse cx="62" cy="73" rx="7.5" ry="4.2" transform="rotate(-12 62 73)" fill="#111111"/><circle cx="71" cy="69" r="3.6" fill="#09090b"/><circle cx="72" cy="68.5" r="1.3" fill="#3f3f46"/><path d="M73 66 Q84 53 91 52" stroke="#e4e4e7" stroke-width="1.4" fill="none" stroke-linecap="round"/><circle cx="91" cy="52" r="1.5" fill="#e4e4e7"/><path d="M72 65 Q81 50 87 48" stroke="#a1a1aa" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg></div>`;
  }

  function triggerColorLandingEffect(x, y, sp) {
    const ring1 = document.createElement('div');
    ring1.className = 'landing-ring'; ring1.style.left = x + 'px'; ring1.style.top = y + 'px';
    ring1.style.setProperty('--glow-color', sp.glowColor); ring1.style.setProperty('--glow-light', sp.glowLight);
    butterflyLayer.appendChild(ring1); setTimeout(() => ring1.remove(), 1500);
    const ring2 = document.createElement('div');
    ring2.className = 'landing-ring-2'; ring2.style.left = x + 'px'; ring2.style.top = y + 'px';
    ring2.style.setProperty('--glow-color', sp.glowColor); ring2.style.setProperty('--glow-light', sp.glowLight);
    butterflyLayer.appendChild(ring2); setTimeout(() => ring2.remove(), 2000);
    for (let i = 0; i < 10; i++) {
      const spark = document.createElement('div');
      spark.className = 'landing-spark'; spark.style.left = x + 'px'; spark.style.top = y + 'px';
      spark.style.setProperty('--glow-color', sp.glowColor); spark.style.setProperty('--glow-light', sp.glowLight);
      const angle = (Math.PI * 2 * i) / 10 + (Math.random() * 0.4);
      const dist = 28 + Math.random() * 36;
      spark.style.setProperty('--dx', Math.cos(angle) * dist + 'px'); spark.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      butterflyLayer.appendChild(spark); setTimeout(() => spark.remove(), 1350);
    }
  }

  function getRandomEdgePoint(excludeSide = -1) {
    const W = window.innerWidth, H = window.innerHeight;
    let side; do { side = Math.floor(Math.random() * 4); } while (side === excludeSide);
    if (side === 0) return { x: -100, y: Math.random() * H, side };
    if (side === 1) return { x: W + 100, y: Math.random() * H, side };
    if (side === 2) return { x: Math.random() * W, y: -100, side };
    return { x: Math.random() * W, y: H + 100, side };
  }

  function getRandomPerchSpot(size, preferSide = null) {
    const targets = [
      document.getElementById('bypassBtn'), document.getElementById('target-label'),
      document.getElementById('target-paste'), document.getElementById('target-reset'),
      document.getElementById('inputLyrics'), document.getElementById('copyBtn')
    ].filter(el => el && el.offsetParent !== null);
    const chosen = targets[Math.floor(Math.random() * targets.length)];
    const rect = chosen.getBoundingClientRect();

    // अगर दो तितलियाँ एक साथ हैं, तो एक बाईं ओर और दूसरी दाईं ओर बैठेगी
    let ratio = Math.random() * 0.65 + 0.15;
    if (preferSide === 'left') ratio = 0.08 + Math.random() * 0.25;
    if (preferSide === 'right') ratio = 0.65 + Math.random() * 0.25;

    return { x: rect.left + ratio * rect.width - size / 2, y: rect.top + rect.height - size * 0.52 };
  }

  let activeButterflies = 0;
  function launchSmartButterfly(shouldLand = true, preferSide = null) {
    if (activeButterflies >= 3) return;
    activeButterflies++;

    // कोशिश करें कि नई तितली का रंग पहले से मौजूद तितली से अलग हो ताकि दोनों साइड अलग-अलग थीम दिखे
    const usedNames = liveButterflies.map(b => b.sp.name);
    const distinctSpecies = speciesList.filter(s => !usedNames.includes(s.name));
    const pool = distinctSpecies.length > 0 ? distinctSpecies : speciesList;
    const sp = pool[Math.floor(Math.random() * pool.length)];

    const sizes = [52, 62, 70, 78];
    const size = sizes[Math.floor(Math.random() * sizes.length)];
    const isSideView = Math.random() < 0.52;
    const startPt = getRandomEdgePoint();
    let curX = startPt.x, curY = startPt.y;
    let state = shouldLand ? 'wandering_to_land' : 'passing_through';
    let targetPt = shouldLand ? getRandomPerchSpot(size, preferSide) : getRandomEdgePoint(startPt.side);
    const flipSide = targetPt.x < curX;

    const tracker = { sp: sp, x: curX };
    liveButterflies.push(tracker);
    syncDualSideThemes(performance.now());

    const el = document.createElement('div');
    el.className = 'butterfly-3d flying';
    el.innerHTML = isSideView ? createSideViewButterfly(sp, size, flipSide) : createTopViewButterfly(sp, size, 25 + Math.floor(Math.random() * 25));
    butterflyLayer.appendChild(el);

    let curAngle = isSideView ? 0 : Math.random() * 360;
    let midXRatio = preferSide === 'left' ? (0.15 + Math.random() * 0.25) : (preferSide === 'right' ? (0.60 + Math.random() * 0.25) : (0.2 + Math.random() * 0.6));
    let midPt = { x: window.innerWidth * midXRatio, y: window.innerHeight * (0.15 + Math.random() * 0.7) };
    let passedMid = false, perchTimer = 0, nextTriggered = false, wanderNoiseSeed = Math.random() * 100;

    function removeTracker() {
      const idx = liveButterflies.indexOf(tracker);
      if (idx !== -1) liveButterflies.splice(idx, 1);
      syncDualSideThemes(performance.now());
    }

    function step(now) {
      wanderNoiseSeed += 0.022;
      tracker.x = curX + size * 0.5;
      syncDualSideThemes(now);

      if (state === 'perched') {
        const idleBreath = Math.sin(wanderNoiseSeed * 1.4) * 1.8;
        el.style.transform = isSideView ? `translate3d(${curX}px, ${curY + idleBreath}px, 0)` : `translate3d(${curX}px, ${curY + idleBreath}px, 0) rotateZ(${curAngle}deg)`;
        if (now - perchTimer > 3600 + Math.random() * 1800) {
          state = 'leaving'; el.classList.remove('perched'); el.classList.add('flying'); targetPt = getRandomEdgePoint();
        }
        requestAnimationFrame(step); return;
      }
      const activeTarget = (!passedMid && state !== 'leaving') ? midPt : targetPt;
      const dx = activeTarget.x - curX, dy = activeTarget.y - curY, dist = Math.hypot(dx, dy);
      if (!passedMid && state !== 'leaving' && dist < 75) passedMid = true;
      if (state === 'wandering_to_land' && passedMid && dist < 12) {
        state = 'perched'; el.classList.remove('flying'); el.classList.add('perched'); perchTimer = now;
        triggerColorLandingEffect(curX + size * 0.5, curY + size * 0.65, sp);
        if (!nextTriggered) {
          nextTriggered = true;
          // 55% चांस कि दूसरी तितली भी साथ आए ताकि दोनों साइड का अलग-अलग थीम दिखे
          const spawnPair = Math.random() < 0.55;
          const mySide = (curX + size * 0.5) < window.innerWidth * 0.5 ? 'left' : 'right';
          const otherSide = mySide === 'left' ? 'right' : 'left';
          setTimeout(() => launchSmartButterfly(true, otherSide), 450);
          if (spawnPair && activeButterflies < 2) {
            setTimeout(() => launchSmartButterfly(true, mySide), 850);
          }
        }
        requestAnimationFrame(step); return;
      }
      if ((state === 'leaving' || state === 'passing_through') && passedMid && dist < 45) {
        el.remove();
        removeTracker();
        activeButterflies = Math.max(0, activeButterflies - 1);
        if (activeButterflies === 0) setTimeout(() => launchSmartButterfly(true, 'left'), 600);
        return;
      }
      const speed = (state === 'wandering_to_land' && passedMid && dist < 100) ? 0.72 : 1.15;
      if (isSideView) {
        const dirX = dx / (dist || 1), dirY = dy / (dist || 1), verticalBob = Math.sin(wanderNoiseSeed * 1.8) * 0.65;
        curX += dirX * speed; curY += dirY * speed + verticalBob;
        el.style.transform = `translate3d(${curX}px, ${curY}px, 0) rotateZ(${dirY * 14 + verticalBob * 8}deg)`;
      } else {
        const desiredAngle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
        const weave = Math.sin(wanderNoiseSeed) * 24;
        const targetAngleWithWeave = desiredAngle + (dist > 60 ? weave : 0);
        let angleDiff = ((targetAngleWithWeave - curAngle + 540) % 360) - 180;
        curAngle += angleDiff * 0.045;
        const rad = (curAngle - 90) * (Math.PI / 180);
        curX += Math.cos(rad) * speed; curY += Math.sin(rad) * speed;
        const bankAngle = Math.max(-24, Math.min(24, angleDiff * 1.3));
        el.style.transform = `translate3d(${curX}px, ${curY}px, 0) rotateZ(${curAngle}deg) rotateY(${bankAngle}deg)`;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // शुरुआत में ही दोनों साइड के लिए दो अलग-अलग रंगों की तितलियाँ लॉन्च करें
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => launchSmartButterfly(true, 'left'), 400);
    setTimeout(() => launchSmartButterfly(true, 'right'), 900);
  });

  function resetBypassBtn() {
    const btn = document.getElementById('bypassBtn');
    btn.classList.remove('done-grey'); btn.innerText = " ⚡ Bypass Lyrics ";
  }

  function processLyrics() {
    const input = document.getElementById('inputLyrics').value;
    const statusEl = document.getElementById('statusText');
    const btn = document.getElementById('bypassBtn');
    const resultBox = document.getElementById('resultSection');
    const copyBtn = document.getElementById('copyBtn');

    if (!input.trim()) {
      statusEl.style.color = '#f43f5e';
      statusEl.innerText = "⚠️ Pehle upar box mein lyrics daalein!";
      return;
    }

    btn.disabled = true;
    btn.classList.remove('done-grey');
    btn.innerText = "⏳ Processing...";
    statusEl.style.color = 'var(--theme-light)';
    statusEl.innerText = "Har letter ke beech invisible character add ho raha hai...";

    setTimeout(() => {
      const inv = '\u200C\u2060';
      const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter)
        ? new Intl.Segmenter('or', { granularity: 'grapheme' })
        : null;

      const bypassed = input.split('\n').map(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('[') && trimmed.endsWith(']')) return line;
        return line.split(' ').map(word => {
          let graphemes;
          if (segmenter) {
            graphemes = Array.from(segmenter.segment(word), s => s.segment);
          } else {
            graphemes = Array.from(word);
          }
          if (graphemes.length <= 1) return word;
          return graphemes.join(inv);
        }).join(' ');
      }).join('\n');

      document.getElementById('outputLyrics').value = bypassed;
      document.getElementById('charCount').innerText = bypassed.length + " chars";
      copyBtn.classList.remove('done-grey');
      copyBtn.innerText = "📋 Copy Lyrics";
      resultBox.style.display = "block";
      btn.disabled = false;
      void btn.offsetWidth;
      btn.classList.add('done-grey');
      btn.innerText = "✅ Done!";
      statusEl.style.color = 'var(--theme-accent-left)';
      statusEl.innerText = "✨ Done! Neeche se Copy karke Suno mein paste karein.";
    }, 350);
  }

  async function pasteLyrics() {
    const inputBox = document.getElementById('inputLyrics');
    const statusEl = document.getElementById('statusText');

    function handlePastedText(text) {
      if (!text || !text.trim()) {
        statusEl.style.color = '#f43f5e';
        statusEl.innerText = "⚠️ Clipboard khali hai! Pehle kahin se lyrics copy karein.";
        return;
      }
      inputBox.value = text;
      resetBypassBtn();
      statusEl.style.color = 'var(--theme-light)';
      statusEl.innerText = "📥 Lyrics paste ho gaye! Automatic bypass ho raha hai...";
      processLyrics();
    }

    if (navigator.clipboard && navigator.clipboard.readText) {
      try {
        const text = await navigator.clipboard.readText();
        handlePastedText(text);
        return;
      } catch (err) {}
    }

    try {
      inputBox.value = '';
      inputBox.focus();
      document.execCommand('paste');
      setTimeout(() => {
        if (inputBox.value.trim()) {
          handlePastedText(inputBox.value);
        } else {
          statusEl.style.color = '#f43f5e';
          statusEl.innerText = "⚠️ Browser ne permission roki hai: Box mein ungli dabakar Paste karein.";
        }
      }, 100);
    } catch (e) {
      inputBox.focus();
      statusEl.style.color = '#f43f5e';
      statusEl.innerText = "⚠️ Box mein ungli dabakar Paste karein.";
    }
  }

  function copyLyrics() {
    const output = document.getElementById('outputLyrics');
    const statusEl = document.getElementById('statusText');
    const copyBtn = document.getElementById('copyBtn');
    const textToCopy = output.value;

    if (!textToCopy) return;

    function markCopiedSuccess() {
      copyBtn.classList.remove('done-grey');
      void copyBtn.offsetWidth;
      copyBtn.classList.add('done-grey');
      copyBtn.innerText = "✅ Copied!";
      statusEl.style.color = 'var(--theme-light)';
      statusEl.innerText = "🎉 Copied! Ab seedha Suno mein paste kar dein.";
    }

    function fallbackCopy() {
      try {
        output.removeAttribute('readonly');
        output.focus();
        output.select();
        output.setSelectionRange(0, 999999);
        const ok = document.execCommand('copy');
        output.setAttribute('readonly', true);
        if (ok) {
          markCopiedSuccess();
        } else {
          statusEl.style.color = '#f43f5e';
          statusEl.innerText = "⚠️ Box mein ungli dabakar Select All -> Copy karein.";
        }
      } catch (e) {
        output.setAttribute('readonly', true);
        statusEl.style.color = '#f43f5e';
        statusEl.innerText = "⚠️ Box mein ungli dabakar Select All -> Copy karein.";
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textToCopy)
        .then(markCopiedSuccess)
        .catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  function clearAll() {
    const copyBtn = document.getElementById('copyBtn');
    document.getElementById('inputLyrics').value = '';
    document.getElementById('outputLyrics').value = '';
    document.getElementById('resultSection').style.display = 'none';
    document.getElementById('statusText').innerText = '';
    resetBypassBtn();
    copyBtn.classList.remove('done-grey');
    copyBtn.innerText = "📋 Copy Lyrics";
  }
</script>
</body>
