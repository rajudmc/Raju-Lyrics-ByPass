<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raju Lyrics ByPass</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #292008 0%, #09090b 100%);
      color: #fefce8;
      margin: 0;
      padding: 20px 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 22px;
    }
    /* Heading me continuous loop shine/wave animation */
    .header h1 {
      font-size: 28px;
      margin: 0 0 6px 0;
      background: linear-gradient(90deg, #f59e0b, #fef08a, #ffffff, #facc15, #f59e0b);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      animation: textLoopShine 3s linear infinite, floatPulse 2.5s ease-in-out infinite;
    }
    @keyframes textLoopShine {
      0% { background-position: 0% center; }
      100% { background-position: 250% center; }
    }
    @keyframes floatPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .header p {
      color: #a1a1aa;
      margin: 0;
      font-size: 13px;
    }
    .card {
      background: rgba(24, 24, 27, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), 0 0 22px rgba(250, 204, 21, 0.14);
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: #fef08a;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      height: 150px;
      background-color: #09090b;
      color: #fefce8;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.5;
      resize: vertical;
      margin-bottom: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: #facc15;
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
    }
    button {
      width: 100%;
      border: none;
      padding: 14px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:active {
      transform: scale(0.96);
    }
    /* Pehele jaisa Purple-Pink Bypass button */
    .btn-bypass {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
    /* Pehele jaisa Cyan-Green Copy button */
    .btn-copy {
      background: linear-gradient(135deg, #06b6d4, #10b981);
      color: #042f2e;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    /* Dono buttons ke liye Grey state aur pop animation */
    .done-grey {
      background: #3f3f46 !important;
      color: #d4d4d8 !important;
      box-shadow: none !important;
      border: 1px solid #52525b !important;
      animation: popPulse 0.35s ease;
    }
    @keyframes popPulse {
      0% { transform: scale(1); }
      40% { transform: scale(0.92); }
      75% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .btn-ghost {
      width: auto;
      background-color: #27272a;
      color: #fef08a;
      border: 1px solid rgba(250, 204, 21, 0.2);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }
    #resultSection {
      display: none;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px dashed rgba(250, 204, 21, 0.4);
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .status-bar {
      text-align: center;
      font-size: 13px;
      color: #facc15;
      min-height: 18px;
      margin-top: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1> ⚡ RAJU LYRICS BYPASS </h1>
    <p>100% Free & Offline • Instant Filter Bypass</p>
  </div>

  <div class="card">
    <div class="label-row">
      <span>📝 Enter Your Lyrics</span>
      <div style="display:flex; gap:6px;">
        <button class="btn-ghost" onclick="pasteLyrics()">📋 Paste</button>
        <button class="btn-ghost" onclick="clearAll()">🗑️ Reset</button>
      </div>
    </div>
    
    <textarea id="inputLyrics" oninput="resetBypassBtn()" placeholder="Yahan apne gaane ke lyrics paste karein..."></textarea>

    <button id="bypassBtn" class="btn-bypass" onclick="processLyrics()">⚡ Bypass Lyrics</button>

    <!-- Yeh section button dabane ke baad khulega -->
    <div id="resultSection">
      <div class="label-row">
        <span>✅ Bypassed Lyrics Ready</span>
        <span id="charCount" style="color:#facc15; font-size:12px;">0 chars</span>
      </div>
      
      <textarea id="outputLyrics" readonly></textarea>
      
      <button id="copyBtn" class="btn-copy" onclick="copyLyrics()">📋 Copy Lyrics</button>
    </div>

    <div id="statusText" class="status-bar"></div>
  </div>
</div>

<script>
  function resetBypassBtn() {
    const btn = document.getElementById('bypassBtn');
    btn.classList.remove('done-grey');
    btn.innerText = " ⚡ Bypass Lyrics ";
  }

  function processLyrics() {
    const input = document.getElementById('inputLyrics').value;
    const statusEl = document.getElementById('statusText');
    const btn = document.getElementById('bypassBtn');
    const resultBox = document.getElementById('resultSection');
    const copyBtn = document.getElementById('copyBtn');

    if (!input.trim()) {
      statusEl.style.color = '#f43f5e';
      statusEl.innerText = "⚠️ Pehle upar box mein lyrics daalein!";
      return;
    }

    btn.disabled = true;
    btn.classList.remove('done-grey');
    btn.innerText = "⏳ Processing...";
    statusEl.style.color = '#fde047';
    statusEl.innerText = "Har letter ke aage invisible character add ho raha hai...";

    setTimeout(() => {
      const zws = '\u200B'; // Zero-Width Space
      
      const bypassed = input.split('\n').map(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
          return line;
        }
        return line.split('').map(char => {
          return char.trim() !== '' ? zws + char : char;
        }).join('');
      }).join('\n');

      document.getElementById('outputLyrics').value = bypassed;
      document.getElementById('charCount').innerText = bypassed.length + " chars";
      
      copyBtn.classList.remove('done-grey');
      copyBtn.innerText = "📋 Copy Lyrics";

      resultBox.style.display = "block";
      
      btn.disabled = false;
      void btn.offsetWidth;
      btn.classList.add('done-grey');
      btn.innerText = "✅ Done!";

      statusEl.style.color = '#facc15';
      statusEl.innerText = "✨ Done! Neeche se Copy karke Suno mein paste karein.";
    }, 450);
  }

  async function pasteLyrics() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('inputLyrics').value = text;
      resetBypassBtn();
      document.getElementById('statusText').style.color = '#fde047';
      document.getElementById('statusText').innerText = "📥 Lyrics paste ho gaye!";
    } catch (err) {
      alert("Box mein ungli dabakar Paste karein.");
    }
  }

  function copyLyrics() {
    const output = document.getElementById('outputLyrics');
    const statusEl = document.getElementById('statusText');
    const copyBtn = document.getElementById('copyBtn');

    output.select();
    navigator.clipboard.writeText(output.value);

    copyBtn.classList.remove('done-grey');
    void copyBtn.offsetWidth;
    copyBtn.classList.add('done-grey');
    copyBtn.innerText = "✅ Copied!";

    statusEl.style.color = '#fde047';
    statusEl.innerText = "🎉 Copied! Ab seedha Suno mein paste kar dein.";
  }

  function clearAll() {
    const copyBtn = document.getElementById('copyBtn');
    document.getElementById('inputLyrics').value = '';
    document.getElementById('outputLyrics').value = '';
    document.getElementById('resultSection').style.display = 'none';
    document.getElementById('statusText').innerText = '';
    resetBypassBtn();
    copyBtn.classList.remove('done-grey');
    copyBtn.innerText = "📋 Copy Lyrics";
  }
</script>

</body>
</html>
